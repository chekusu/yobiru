# systemd drop-in for the official gateway, which shares its machine with other services (PinkuChat, CI runners,
# docker). Install as /etc/systemd/system/yobiru-gateway.service.d/capacity.conf, then `systemctl daemon-reload`;
# the values apply at the next restart of yobiru-gateway.service.
[Service]
# Under CPU contention the gateway gets twice the share of a service with the default weight (100). It cannot use
# much more than `processes` + 2 cores anyway: each process runs Python code on one core at a time.
CPUWeight=200
# Each held connector poll is a thread: up to 1,000 per request process, 8 processes, plus the request slots.
TasksMax=16384
# Each held poll keeps a socket; serve also raises its own soft limit to what it needs.
LimitNOFILE=524288
# About 150 KB per held poll, so 8,000 held polls are about 1.2 GB. Above MemoryHigh the kernel reclaims the
# gateway's memory first; MemoryMax ends it (systemd restarts it) before it can take memory from the other services.
MemoryHigh=8G
MemoryMax=12G
